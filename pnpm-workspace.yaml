# pnpm ≥ 10 reads overrides here, not from package.json#pnpm.
# Transitive advisories pinned by the toolchain; drop an entry once
# `pnpm why <pkg>` shows the patched version without it.
overrides:
  dompurify: ^3.4.17   # @logseq/libs pins 3.3.3
  lodash-es: ^4.18.1   # @logseq/libs pins 4.17.23
minimumReleaseAgeExclude:
  - '@vitest/coverage-v8@5.0.5'
  - '@vitest/mocker@5.0.5'
  - '@vitest/spy@5.0.5'
  - vitest@5.0.5
allowBuilds:
  esbuild: true
